<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" width="100%" font-family="system-ui,-apple-system,Segoe UI,Microsoft YaHei,sans-serif" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b8"/></marker></defs><rect width="640" height="512" fill="#ffffff"/><text x="40" y="42" font-size="16" font-weight="700" fill="#1a1d24">60 秒演示结构 · 故事 → 光线 → 镜头 → 剪辑</text><line x1="40" y1="58" x2="600" y2="58" stroke="#e3e6ec"/><line x1="72" y1="129" x2="72" y2="441" stroke="#d6dbe6" stroke-width="2"/><circle cx="72" cy="129" r="7" fill="#fff" stroke="#2358c8" stroke-width="2.5"/><text x="72" y="159" font-size="11" fill="#8891a3" text-anchor="middle">00:00</text><g><rect x="118" y="92" width="452" height="74" rx="12" fill="#f7f9fd" stroke="#d8e0ef" stroke-width="1.5"/><circle cx="142" cy="129" r="13" fill="#2358c8" opacity="0.12"/><text x="142" y="133" font-size="12" font-weight="700" fill="#2358c8" text-anchor="middle">1</text><text x="166" y="127" font-size="13.5" font-weight="600" fill="#1a1d24">先定故事：一杯咖啡，从桌面到手中</text><text x="166" y="147" font-size="11.5" fill="#69748a">一个物体、一个动作、一个结果</text></g><circle cx="72" cy="233" r="7" fill="#fff" stroke="#2358c8" stroke-width="2.5"/><text x="72" y="263" font-size="11" fill="#8891a3" text-anchor="middle">00:08</text><g><rect x="118" y="196" width="452" height="74" rx="12" fill="#f7f9fd" stroke="#d8e0ef" stroke-width="1.5"/><circle cx="142" cy="233" r="13" fill="#2358c8" opacity="0.12"/><text x="142" y="237" font-size="12" font-weight="700" fill="#2358c8" text-anchor="middle">2</text><text x="166" y="231" font-size="13.5" font-weight="600" fill="#1a1d24">稳定光线：先看明暗，再定机位</text><text x="166" y="251" font-size="11.5" fill="#69748a">柔和侧光、干净背景、稳定亮度</text></g><circle cx="72" cy="337" r="7" fill="#fff" stroke="#2358c8" stroke-width="2.5"/><text x="72" y="367" font-size="11" fill="#8891a3" text-anchor="middle">00:24</text><g><rect x="118" y="300" width="452" height="74" rx="12" fill="#f7f9fd" stroke="#d8e0ef" stroke-width="1.5"/><circle cx="142" cy="337" r="13" fill="#2358c8" opacity="0.12"/><text x="142" y="341" font-size="12" font-weight="700" fill="#2358c8" text-anchor="middle">3</text><text x="166" y="335" font-size="13.5" font-weight="600" fill="#1a1d24">组织镜头：交代关系、动作与细节</text><text x="166" y="355" font-size="11.5" fill="#69748a">全景看关系，中景看动作，特写看细节</text></g><circle cx="72" cy="441" r="7" fill="#fff" stroke="#2358c8" stroke-width="2.5"/><text x="72" y="471" font-size="11" fill="#8891a3" text-anchor="middle">00:45</text><g><rect x="118" y="404" width="452" height="74" rx="12" fill="#f7f9fd" stroke="#d8e0ef" stroke-width="1.5"/><circle cx="142" cy="441" r="13" fill="#2358c8" opacity="0.12"/><text x="142" y="445" font-size="12" font-weight="700" fill="#2358c8" text-anchor="middle">4</text><text x="166" y="439" font-size="13.5" font-weight="600" fill="#1a1d24">完成剪辑：先接顺，再检查声音</text><text x="166" y="459" font-size="11.5" fill="#69748a">按动作接镜头，分别检查画面与声音</text></g><path d="M344,169 L344,189" fill="none" stroke="#9aa4b8" stroke-width="1.6" marker-end="url(#ar)"/><path d="M344,273 L344,293" fill="none" stroke="#9aa4b8" stroke-width="1.6" marker-end="url(#ar)"/><path d="M344,377 L344,397" fill="none" stroke="#9aa4b8" stroke-width="1.6" marker-end="url(#ar)"/></svg>